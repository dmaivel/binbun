# binbun.org: site/ built with the Zola pinned below, its generated pages
# checked current (scripts/site/generate.py; the command-line page needs a
# binbun and is checked by hand), its internal links checked, the release
# files added (scripts/site/release-files.sh), and the result deployed to
# Cloudflare as a Worker with static assets (site/wrangler.jsonc).
#
# Deploys on a push to main and from the release workflow once a release
# is published (its install.sh and latest.json); a pull request only
# builds. Both deploys build main's site/.
#
# Repository secrets (the release workflow passes them on):
# CLOUDFLARE_API_TOKEN, a token allowed to edit the account's Workers
# scripts and binbun.org's Workers routes, and CLOUDFLARE_ACCOUNT_ID.

name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site/**"
      - ".github/workflows/site.yml"
      - "python/binbun/**"
      - "crates/binbun-py/src/**"
      - "crates/binbun-capi/include/binbun/*.h"
      - "examples/*/quick_start.*"
      - "examples/*/decompiler_quick_start.*"
  pull_request:
    paths:
      - "site/**"
      - "scripts/site/**"
      - ".github/workflows/site.yml"
      - "python/binbun/**"
      - "crates/binbun-py/src/**"
      - "crates/binbun-capi/include/binbun/*.h"
      - "examples/*/quick_start.*"
      - "examples/*/decompiler_quick_start.*"
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

env:
  ZOLA_VERSION: 0.23.6
  ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4
  WRANGLER_VERSION: 4.162.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Called by the release workflow (a tag): main's site, not the tag's.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || '' }}
      - name: Zola
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/zola-v$ZOLA_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZOLA_SHA256  $RUNNER_TEMP/zola.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/bin" zola
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Generated pages current
        run: scripts/site/generate.py --check python c landing
      # Before the build: the download page reads the latest release's
      # latest.json.
      - name: Release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/site/release-files.sh site/static
      - name: Internal links and build
        working-directory: site
        run: |
          zola check --skip-external-links
          zola build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/public
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    environment:
      name: site
      url: https://binbun.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || '' }}
          sparse-checkout: site/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/public
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Deploy to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy
