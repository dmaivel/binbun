# Builds every release file (scripts/release/package-*.sh) and the Python
# wheels, tests them where they run, and uploads them as artifacts:
# dist-* (the GitHub release's files) and wheels-* (PyPI's). Called by
# release.yml on a tag (attest: true, each file attested by the job that
# built it) and by nightly.yml as a dry run. Nothing is cached, so a
# release is built from the tag's sources and the pinned toolchain
# alone; with `signatures`, the signature packs signatures.yml built (and
# cached by their provenance) earlier in the run and those made by hand
# (scripts/signatures/hand-built, checked there), its artifact
# `signatures`, are installed with binbun (the package scripts'
# --signatures).

name: Package

on:
  workflow_call:
    inputs:
      attest:
        description: Attest each built file (GitHub artifact attestations)
        type: boolean
        default: false
      signatures:
        description: Install the signature packs of this run's signatures artifact with binbun
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (app, CLI, C library)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # glibc 2.28: the binaries run on every distribution since 2018.
    container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      BINBUN_MAX_GLIBC: "2.28"
    steps:
      - name: git, for checkout
        run: dnf -y -q install git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build environment (scripts/release/container-setup.sh)
        run: |
          scripts/release/container-setup.sh
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Signature packs (signatures.yml)
        if: inputs.signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: signatures
      - name: App and CLI
        shell: bash
        env:
          SIGNATURES: ${{ inputs.signatures }}
        run: |
          signatures=()
          if [ "$SIGNATURES" = true ]; then signatures=(--signatures signatures); fi
          scripts/release/package-linux.sh --target ${{ matrix.arch }}-unknown-linux-gnu --out dist "${signatures[@]}"
      - name: C library
        run: |
          scripts/release/install-cargo-c.sh
          scripts/release/package-capi.sh --target ${{ matrix.arch }}-unknown-linux-gnu --out dist
      - name: Smoke test
        run: |
          mkdir smoke
          tar -xzf dist/binbun-cli-*.tar.gz -C smoke --strip-components=1
          smoke/bin/binbun --version
          smoke/bin/binbun functions tests/fixtures/program-x86_64.elf > /dev/null
      - if: inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux-musl:
    name: Linux ${{ matrix.arch }} musl (CLI)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: musl's C compiler (ring's C)
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y --no-install-recommends musl-tools
          echo "CC_${{ matrix.arch }}_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Signature packs (signatures.yml)
        if: inputs.signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: signatures
      - name: CLI
        env:
          SIGNATURES: ${{ inputs.signatures }}
        run: |
          signatures=()
          if [ "$SIGNATURES" = true ]; then signatures=(--signatures signatures); fi
          scripts/release/package-linux.sh --target ${{ matrix.arch }}-unknown-linux-musl --out dist "${signatures[@]}"
      - name: Smoke test (static)
        run: |
          mkdir smoke
          tar -xzf dist/binbun-cli-*.tar.gz -C smoke --strip-components=1
          # Static (plain or PIE, as each target links by default): no
          # program interpreter, the dynamic loader, to ask for.
          file smoke/bin/binbun
          if readelf -l smoke/bin/binbun | grep -q INTERP; then
            echo "smoke/bin/binbun asks for a dynamic loader: not static" >&2
            exit 1
          fi
          smoke/bin/binbun --version
      - if: inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-musl-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (app, C library)
    strategy:
      fail-fast: false
      matrix:
        # Intel is cross-compiled on Apple silicon.
        arch: [aarch64, x86_64]
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signature packs (signatures.yml)
        if: inputs.signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: signatures
      - name: App
        env:
          SIGNATURES: ${{ inputs.signatures }}
        run: |
          signatures=()
          if [ "$SIGNATURES" = true ]; then signatures=(--signatures signatures); fi
          scripts/release/package-macos.sh --target ${{ matrix.arch }}-apple-darwin --out dist "${signatures[@]}"
      - name: C library
        run: |
          scripts/release/install-cargo-c.sh
          scripts/release/package-capi.sh --target ${{ matrix.arch }}-apple-darwin --out dist
      - name: Smoke test
        if: matrix.arch == 'aarch64'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/binbun-*.dmg
          "$RUNNER_TEMP/dmg/binbun.app/Contents/MacOS/binbun" --version
          codesign --verify --strict "$RUNNER_TEMP/dmg/binbun.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - if: inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} (app, C library)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: windows-2025 }
          - { arch: aarch64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signature packs (signatures.yml)
        if: inputs.signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: signatures
      - name: App
        env:
          SIGNATURES: ${{ inputs.signatures }}
        run: |
          signatures=()
          if [ "$SIGNATURES" = true ]; then signatures=(--signatures signatures); fi
          scripts/release/package-windows.sh --target ${{ matrix.arch }}-pc-windows-msvc --out dist "${signatures[@]}"
      - name: C library
        run: |
          scripts/release/install-cargo-c.sh
          scripts/release/package-capi.sh --target ${{ matrix.arch }}-pc-windows-msvc --out dist
      - name: Smoke test
        run: |
          mkdir smoke
          7z x -bd -bso0 -osmoke dist/binbun-*-pc-windows-msvc.zip
          # The PE optional header's Subsystem (2: GUI, 3: console).
          subsystem() {
            local pe
            pe=$(od -An -tu4 -j60 -N4 "$1" | tr -d ' ')
            od -An -tu2 -j$((pe + 24 + 68)) -N2 "$1" | tr -d ' '
          }
          [ "$(subsystem smoke/binbun.exe)" = 2 ] || { echo "binbun.exe is not a GUI program"; exit 1; }
          [ "$(subsystem smoke/bin/binbun.exe)" = 3 ] || { echo "bin/binbun.exe is not a console program"; exit 1; }
          smoke/bin/binbun.exe --version
      - if: inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  wheels:
    name: Wheel ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2_28", test: native }
          - { name: manylinux aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28", test: native }
          - { name: musllinux x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, test: alpine }
          - { name: musllinux aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, test: alpine }
          - { name: macOS arm64, os: macos-15, target: aarch64-apple-darwin, test: native }
          - { name: macOS x86_64, os: macos-15, target: x86_64-apple-darwin, test: none }
          - { name: Windows x64, os: windows-2025, target: x86_64-pc-windows-msvc, test: native }
          - { name: Windows arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, test: native }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out wheels
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'aarch64-apple-darwin' && '11.0' || '10.12' }}
      - name: Test (python/tests)
        if: matrix.test == 'native'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          venv=$RUNNER_TEMP/venv
          [ -x "$venv/bin/python" ] && py=$venv/bin/python || py=$venv/Scripts/python.exe
          "$py" -m pip install --quiet pytest mypy wheels/*.whl
          cd python/tests && "$py" -m pytest -q
      - name: Test (python/tests, Alpine)
        if: matrix.test == 'alpine'
        # musl-utils: ldd, which test_package.py lists the extension's
        # libraries with.
        run: >
          docker run --rm -v "$PWD:/binbun" -w /binbun/python/tests python:3.11-alpine
          sh -euc 'apk add --no-cache --quiet musl-utils &&
          pip install --quiet pytest mypy /binbun/wheels/*.whl && python -m pytest -q'
      - if: inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: wheels/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: wheels/*
          if-no-files-found: error

  sdist:
    name: Python sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out wheels
      - name: The sdist builds and passes the tests
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet pytest mypy wheels/*.tar.gz
          cd python/tests && "$RUNNER_TEMP/venv/bin/python" -m pytest -q
      - if: inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: wheels/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: wheels/*
          if-no-files-found: error
