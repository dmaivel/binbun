# A release, on pushing a tag vX.Y.Z (or vX.Y.Z-rc.N, a pre-release):
#
# 1. check: the tag's version is the workspaces' and the C library's, and
#    CHANGELOG.md has a dated, non-empty section for it
#    (scripts/release/check-release.sh); otherwise nothing is built.
# 2. signatures: the signature packs installed with binbun, built from
#    pinned inputs or taken from the cache by their provenance
#    (signatures.yml, scripts/signatures/packs.sh), and those of
#    Microsoft's libraries made by hand (scripts/signatures/hand-built,
#    each checked against its SHA-256 there).
#    package: every file built, tested and attested, the packs in each
#    (package.yml).
# 3. draft: SHA256SUMS, install.sh with each file's SHA-256 written in,
#    latest.json (the update feed), those attested too, and a draft
#    GitHub release with the CHANGELOG section as its notes.
# 4. publish (the `release` environment: the owner approves): the draft
#    published, after which it is immutable (with immutable releases on
#    in the repository's settings), and the wheels uploaded to PyPI
#    (trusted publishing, attestations); a pre-release's are not.
#    crates (the same environment and approval; full releases only): the
#    `binbun` command's crates, `binbun-disasm` and the C library's
#    published to crates.io (trusted publishing), in dependency order,
#    those already there skipped (scripts/release/publish-crates.sh).
# 5. site: binbun.org deployed again (site.yml), with the release's
#    install.sh and, for a full release, its latest.json.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Version and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(scripts/release/check-release.sh "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case $version in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # The downloads carry third_party/licenses/: made from the locked
      # crates, they must be current.
      - name: Toolchain (rust-toolchain.toml)
        run: cargo --version
      - name: Third-party licences (scripts/release/third-party-licenses.sh)
        run: |
          scripts/release/install-cargo-about.sh
          scripts/release/third-party-licenses.sh --check

  package:
    needs: [check, signatures]
    uses: ./.github/workflows/package.yml # zizmor: ignore[self-repository] (actionlint knows only ./)
    with:
      attest: true
      signatures: true
    permissions:
      contents: read
      id-token: write
      attestations: write

  signatures:
    needs: check
    uses: ./.github/workflows/signatures.yml # zizmor: ignore[self-repository] (actionlint knows only ./)
    permissions:
      contents: read

  draft:
    name: Draft release
    needs: [check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS, install.sh, latest.json
        run: scripts/release/release-files.sh "$VERSION" dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/install.sh
            dist/latest.json
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/release-notes.sh "$VERSION" dist > "$RUNNER_TEMP/notes.md"
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "binbun $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

  publish:
    name: Publish
    needs: [check, draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Required reviewers (the owner) approve here, after looking at the
    # draft; PyPI's trusted publisher is bound to this workflow and
    # environment.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
    env:
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.check.outputs.prerelease == 'false'
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=true
          [ "$PRERELEASE" = true ] && latest=false
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
      - name: PyPI
        if: needs.check.outputs.prerelease == 'false'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels

  crates:
    name: crates.io
    needs: [check, draft]
    # A version on crates.io can never be replaced (only yanked), so
    # pre-releases stay off it.
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Approved with `publish`; crates.io's trusted publisher is bound to
    # this workflow and environment.
    environment:
      name: release
      url: https://crates.io/crates/binbun-cli
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: cargo --version
      # Before the token, which lasts 30 minutes: every crate built from
      # its package alone.
      - name: Package and build each crate
        run: scripts/release/publish-crates.sh package "$VERSION"
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/release/publish-crates.sh publish "$VERSION"

  site:
    needs: publish
    uses: ./.github/workflows/site.yml # zizmor: ignore[self-repository] (actionlint knows only ./)
    permissions:
      contents: read
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
