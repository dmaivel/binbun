# A separate workspace, so the main build never needs libclang or
# windows-metadata. Built by `scripts/typedb.sh`; see src/main.rs.
[workspace]

[package]
name = "binbun-typegen"
description = "Generates binbun's type databases (JSON Lines) from C headers (libclang), Windows metadata (.winmd) and syzkaller's syscall descriptions (syzlang)."
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
binbun-typedb = { path = "../../crates/binbun-typedb" }
clang = { version = "2.0.0", features = ["clang_10_0"], optional = true }
object = { version = "0.40", default-features = false, features = ["read", "std"] }
windows-metadata = { version = "0.60.0", optional = true }

[features]
# C headers, parsed by libclang (needs libclang at build and run time).
headers = ["dep:clang"]
# Windows metadata.
winmd = ["dep:windows-metadata"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
redundant_clone = "warn"
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
unwrap_used = "warn"
indexing_slicing = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
