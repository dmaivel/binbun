# Facts about library functions that no type database binbun embeds states
# for every target, written by hand, each with the reason it holds: the
# standard, documentation or source that says so (Origin::Override). A fact a
# database's declaration states (Origin::Header, Winmd) is stronger and wins.
#
#   name       the function, as imported (C++ names mangled)
#   library    the library it is matched in (omitted: any; an ELF import's
#              library is its symbol version's or none, and Windows imports
#              the C runtime from several DLLs)
#   no_return  whether it never returns to its caller (omitted: says nothing)
#   format     the format string it takes, as GCC's format attribute says
#              it: { archetype, string, first }, indices from 1
#   signature  its prototype, for a function no header declares, in the
#              databases' form ({ return, params = [{ type }], variadic }),
#              of primitive types only
#   reason     why

# The C standard (ISO/IEC 9899:2018), for every C runtime. glibc's headers
# declare these noreturn too, which the linux-x86_64 database records.

[[function]]
name = "abort"
no_return = true
reason = "ISO C17 7.22.4.1: the abort function does not return to its caller (_Noreturn)"

[[function]]
