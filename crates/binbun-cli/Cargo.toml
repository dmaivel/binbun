[package]
name = "binbun-cli"
description = "The binbun command-line disassembler and decompiler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["disassembler", "decompiler", "reverse-engineering", "cli"]
categories = ["command-line-utilities", "development-tools::debugging"]

[[bin]]
name = "binbun"
path = "src/main.rs"
# The engine's library is `binbun` too: its documentation is the one at
# `target/doc/binbun`.
doc = false

[dependencies]
binbun.workspace = true
binbun-aarch64.workspace = true
binbun-ast.workspace = true
binbun-print.workspace = true
binbun-collab = { workspace = true, optional = true }
binbun-debuginfo = { workspace = true, features = ["symbols"] }
binbun-decompile.workspace = true
binbun-loader.workspace = true
binbun-paths.workspace = true
binbun-semantics.workspace = true
binbun-session.workspace = true
binbun-sigpack.workspace = true
binbun-x86.workspace = true
# The ids of requests to join (`collab`), drawn at random.
getrandom = { workspace = true, optional = true }
msvc-demangler.workspace = true
rmcp = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
# `binbun update --check` and the GUI's checks (`update`).
ureq.workspace = true

# `binbun mcp`: the interpreter killed with what it started (its process
# group).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[features]
default = ["collab", "mcp"]
# `binbun id`, `share`, `join` and `edit`: projects shared between peers
# (`binbun-collab`, on iroh and tokio). Without it, binbun has no network
# code but the symbol servers' HTTP.
collab = ["dep:binbun-collab", "dep:getrandom", "dep:tokio"]
# `binbun mcp`: binbun's tools for an agent, an MCP server on standard
# input and output (`rmcp`, on tokio), with the user's Python.
mcp = ["dep:rmcp", "dep:rustix", "dep:tokio", "tokio/process"]

[lints]
workspace = true
