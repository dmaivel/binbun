# `cargo deny check` (the nightly workflow, both workspaces: Cargo.toml and
# gui/Cargo.toml): known vulnerabilities, licences, where crates come from.

[graph]
all-features = true

[advisories]
# A crate with a vulnerability, unmaintained or yanked fails the check;
# an advisory accepted after review goes here with the reason.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (no fix to take; skrifa is the suggested
    # replacement). The GUI reads only its bundled fonts with it (the
    # avatars' initials), and GPUI's text stack (fontdb, cosmic-text,
    # usvg) depends on it too, so it goes when GPUI moves off it.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no fix; reads bundled fonts only; also in GPUI's text stack" },
]

[licenses]
# Licences binbun's MIT OR Apache-2.0 builds may contain. A dependency
# under several licences ("A OR B") needs one of them here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots: Mozilla's root certificates (rustls, for symbol servers
    # and the update check).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft (attohttpc, through iroh's port mapping; dwrote
    # and option-ext in the GUI): their sources stay as published on
    # crates.io, unmodified.
    "MPL-2.0",
    "Unicode-3.0",
    # Public domain dedication (iroh's WebSocket transport's crates).
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspaces' own crates are path dependencies without versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
