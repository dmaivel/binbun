# binbun's GUI: a workspace of its own, so GPUI,
# its system libraries and its build times stay out of the engine's
# workspace and gates. The engine crates are path dependencies.
[workspace]
resolver = "3"
members = ["view", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dmaivel/binbun"
publish = false

[workspace.dependencies]
binbun = { path = "../crates/binbun" }
binbun-ast = { path = "../crates/binbun-ast" }
binbun-print = { path = "../crates/binbun-print" }
# The `binbun` command's commands, which the GUI's `binbun` runs too.
binbun-cli = { path = "../crates/binbun-cli", default-features = false }
binbun-collab = { path = "../crates/binbun-collab" }
binbun-debuginfo = { path = "../crates/binbun-debuginfo" }
binbun-decompile = { path = "../crates/binbun-decompile" }
binbun-demangle = { path = "../crates/binbun-demangle" }
binbun-loader = { path = "../crates/binbun-loader" }
binbun-paths = { path = "../crates/binbun-paths" }
binbun-protocol = { path = "../crates/binbun-protocol" }
binbun-semantics = { path = "../crates/binbun-semantics" }
binbun-session = { path = "../crates/binbun-session" }
binbun-ssa = { path = "../crates/binbun-ssa" }
binbun-typedb = { path = "../crates/binbun-typedb" }
binbun-typeinfer = { path = "../crates/binbun-typeinfer" }
binbun-gui-view = { path = "view" }

async-channel = "2.5.0"
blake3 = "1.8.7"
# binbun.exe's icon resource (app/build.rs; Windows targets only). Already
# GPUI's, for its manifest. MIT.
embed-resource = "=3.0.12"
gpui-kit = "=0.9.1"
# Chat times in the user's own time zone (the system's tzdb or TZ; on
# Windows and macOS their native zone). Unlicense OR MIT.
jiff = "0.2.43"
# The share dialog's QR code: the encoder alone (no image or SVG output).
qrcode = { version = "0.14.1", default-features = false }
regex = "1.13.1"
# A test's renderer of the agents' marks, to check where their ink is
# (the one GPUI draws SVGs with). Apache-2.0 OR MIT.
resvg = { version = "0.46.0", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
# The avatars' initials' ink (an outline's bounds; already GPUI's, through
# fontdb). MIT OR Apache-2.0.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

# The root workspace's lints, unchanged.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Clones must be deliberate.
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
redundant_clone = "warn"
# Every enum match names its variants, so adding a variant is a compile error.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# No silent panics on attacker-controlled input.
unwrap_used = "warn"
indexing_slicing = "warn"
# Taste.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# As the main workspace's: zstd's library compresses the type databases
# at level 19 in binbun-typedb's build script (minutes unoptimised), and
# ruzstd decompresses the Win32 database in debug builds.
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.release.package.zstd-sys]
opt-level = 3
[profile.dev.package.ruzstd]
opt-level = 3

[profile.release]
debug = 0
