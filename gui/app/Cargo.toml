[package]
name = "binbun-gui"
description = "The binbun command with binbun's GUI: GPUI renders the view models of binbun-gui-view and routes input to them; the commands are binbun-cli's."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
# The one `binbun`: the GUI, and every command of the CLI's.
name = "binbun"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
binbun.workspace = true
binbun-cli.workspace = true
binbun-collab = { workspace = true, optional = true }
binbun-gui-view.workspace = true
binbun-paths.workspace = true
binbun-protocol.workspace = true
binbun-session.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
qrcode.workspace = true
tokio = { workspace = true, optional = true }
ttf-parser.workspace = true

# `BINBUN_FRAME_TRACE`'s CPU time of each frame (the thread's clock).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["time"] }

# The allocator (`main.rs`).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator.workspace = true

# binbun.exe's icon (build.rs; does nothing for other targets, kept
# unconditional so cross builds for Windows get it too).
[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
resvg.workspace = true

[features]
default = ["collab", "mcp"]
# Collaboration: sharing a project, joining
# one, presence and chat, on iroh and tokio (`binbun-collab`). Without it
# the GUI has no network code, and Share and Join say it was built
# without collaboration, as `binbun id`, `share`, `join` and `edit` do.
collab = ["dep:binbun-collab", "dep:tokio", "binbun-cli/collab"]
# `binbun mcp`: binbun's tools for an agent, an MCP server on standard
# input and output (binbun-cli's).
mcp = ["binbun-cli/mcp"]

[lints]
workspace = true
