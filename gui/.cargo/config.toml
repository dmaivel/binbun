# The Zig libghostty-vt's source builds with (the terminal: gui/Cargo.toml's
# ghostty-vt): the pinned one, fetched the first time it runs
# (scripts/zig-run.sh). A ZIG of the environment wins; Windows sets one
# (scripts/zig.sh's output).
[env]
ZIG = { value = "../scripts/zig-run.sh", relative = true, force = false }
