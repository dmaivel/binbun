# `cargo about` (scripts/release/third-party-licenses.sh): the licences of
# the crates each download is built from, in third_party/licenses/. The
# accepted licences are deny.toml's; where a crate offers a choice, the
# first of these it offers is the one listed.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only what is linked into the binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
