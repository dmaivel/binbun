# The iroh-relay service's own journal (LogNamespace=iroh-relay), installed
# by setup.sh as /etc/systemd/journald@iroh-relay.conf: in memory only,
# gone at reboot, at most 2 days or 16 MB, copied nowhere else.
[Journal]
Storage=volatile
RuntimeMaxUse=16M
MaxRetentionSec=2day
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
